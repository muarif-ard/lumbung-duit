<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DCE6F6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lumbung Duit">
<meta name="description" content="Aplikasi pencatat keuangan dan tabungan pribadi.">
<title>Lumbung Duit: keuangan pribadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#E2EBE7; --ink:#13302B; --muted:#5B726C; --line:#D3DFDB;
  --jade:#0E7C66; --jade-ink:#FFFFFF; --jade-soft:#D6EEE7;
  --kunyit:#C98F12; --kunyit-bar:#E0A526; --kunyit-soft:#FBEFD2;
  --merah:#B93E33; --merah-soft:#F7DEDB;
  --hero:#0F4F43; --hero-ink:#EAF6F2; --hero-muted:#A9CFC5;
  --shadow:0 1px 2px rgba(19,48,43,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1614; --surface:#15211E; --surface2:#1E2D29; --ink:#E3EEEA; --muted:#94ABA4; --line:#26372F;
    --jade:#3CC4A2; --jade-ink:#062019; --jade-soft:#173A31;
    --kunyit:#F0BE4A; --kunyit-bar:#F0BE4A; --kunyit-soft:#3A2F14;
    --merah:#EF7A6E; --merah-soft:#3B1E1B;
    --hero:#123B33; --hero-ink:#E6F5F0; --hero-muted:#8DBDB1;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#15211E; --surface2:#1E2D29; --ink:#E3EEEA; --muted:#94ABA4; --line:#26372F;
  --jade:#3CC4A2; --jade-ink:#062019; --jade-soft:#173A31;
  --kunyit:#F0BE4A; --kunyit-bar:#F0BE4A; --kunyit-soft:#3A2F14;
  --merah:#EF7A6E; --merah-soft:#3B1E1B;
  --hero:#123B33; --hero-ink:#E6F5F0; --hero-muted:#8DBDB1;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.bookchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.sync{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.sync.ok{background:var(--jade)} .sync.sync-on{background:var(--kunyit-bar)} .sync.err{background:var(--merah)}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:22px 20px 18px;margin:4px 0 14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.05)}
.hero small{color:var(--hero-muted);font-size:13px;font-weight:500}
.hero .amt{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 16px;line-height:1.1;word-break:break-word}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.hero-row span{display:block;font-size:12px;color:var(--hero-muted)}
.hero-row b{font-size:14px;font-weight:700;word-break:break-word}

/* wallets strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px 8px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.wchip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;text-align:left;min-width:132px}
.wchip span{display:block;font-size:12px;color:var(--muted)}
.wchip b{font-size:15px}

/* sections & cards */
.sec{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:16px;font-weight:700;margin:0}
.link{background:none;border:0;color:var(--jade);font-weight:600;font-size:14px;padding:4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.list .row:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:18px;flex:none}
.row-main{flex:1;min-width:0}
.row-title{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--jade)} .amt.out{color:var(--merah)} .amt.save{color:var(--kunyit)}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;padding:14px 4px 6px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* progress */
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--jade)}
.bar.gold i{background:var(--kunyit-bar)}
.bar.warn i{background:var(--kunyit-bar)}
.bar.over i{background:var(--merah)}
.between{display:flex;justify-content:space-between;gap:10px;align-items:baseline}

/* buttons & inputs */
.btn{border:0;background:var(--jade);color:var(--jade-ink);font-weight:700;border-radius:14px;padding:12px 16px;min-height:46px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--merah);color:#fff}
.btn.ghost.danger{background:var(--merah-soft);color:var(--merah)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn.full{width:100%}
.btns{display:flex;gap:10px;margin-top:18px}
.btns .btn{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field span,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.flabel{display:block;margin:12px 0 6px}
input,select{background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:11px 12px;width:100%;min-height:44px}
input:focus,select:focus{border-color:var(--jade);outline:none}
input.big{font-size:28px;font-weight:800;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:4px;gap:4px;margin-top:6px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.catgrid button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2;min-height:62px}
.catgrid button b{font-size:20px;font-weight:400}
.catgrid button.on{border-color:var(--jade);background:var(--jade-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 10px}
.monthnav b{font-size:16px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.check input{width:20px;height:20px;min-height:0}

/* features */
.feat{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:8px}
.feat .ico{background:var(--jade-soft)}
.feat.locked .ico{background:var(--surface2);filter:grayscale(1);opacity:.7}
.feat p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;flex:none}
.pill.p-lock{background:var(--surface2);color:var(--muted)}
.pill.p-open{background:var(--jade-soft);color:var(--jade)}
.hint{background:var(--kunyit-soft);border:1px solid transparent;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:14px}
.hint b{display:block}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.nav button span{font-size:19px;line-height:1}
.nav button.on{color:var(--jade)}
.nav .fab{width:54px;height:54px;border-radius:18px;background:var(--jade);color:var(--jade-ink);font-size:28px;font-weight:400;justify-self:center;margin-top:-22px;border:4px solid var(--bg);padding:0;display:grid;place-items:center}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,13,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 0 4px;font-size:19px;font-weight:800}
.sheet p{margin:6px 0}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none;visibility:visible;transition:transform .25s ease}
@media (prefers-reduced-motion: reduce){.sheet,.scrim{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* charts */
.chart{width:100%;height:auto;display:block}
.ct{fill:var(--muted);font-size:11px;font-family:inherit}
.donutwrap{display:flex;gap:16px;align-items:center}
.donut{width:140px;flex:none}
.dt1{fill:var(--muted);font-size:11px}
.dt2{fill:var(--ink);font-size:15px;font-weight:800}
.legend{flex:1;min-width:0;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px;margin:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px}

/* score */
.score{display:flex;align-items:center;gap:16px}
.score-num{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;flex:none;border:7px solid var(--jade);color:var(--jade)}
.score-num.mid{border-color:var(--kunyit-bar);color:var(--kunyit)}
.score-num.low{border-color:var(--merah);color:var(--merah)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.cal button{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:13px;font-weight:600}
.cal button.today{border-color:var(--jade)}
.cal button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal .dots{display:flex;gap:2px;min-height:6px}
.cal .dots i{width:5px;height:5px;border-radius:50%}

/* challenge */
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.weeks button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:12px;line-height:1.25}
.weeks button b{display:block;font-size:13px}
.weeks button.done{background:var(--kunyit-soft);border-color:var(--kunyit-bar)}

/* lock screen */
.lockscreen{position:fixed;inset:0;z-index:50;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.lockscreen h2{margin:12px 0 4px;font-size:22px}
.lockscreen input{max-width:220px;text-align:center;font-size:26px;letter-spacing:.4em;margin:18px 0 12px;background:rgba(255,255,255,.1);color:var(--hero-ink)}
.lockscreen .btn{min-width:220px;background:var(--hero-ink);color:var(--hero)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
/* ===== tema berwarna ===== */
:root{--hero2:#1C3F73;--tint:#0E9F87;--in:#12956F;--out:#D9483B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero2:#1E2F57;--in:#46CFA3;--out:#F27D6F}}
:root[data-theme="dark"]{--hero2:#1E2F57;--in:#46CFA3;--out:#F27D6F}
.hero{background:linear-gradient(135deg,var(--hero) 0%,var(--hero2) 100%)}
.hero::after{border-color:rgba(255,255,255,.07)}
.hero::before{content:"";position:absolute;left:-36px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:rgba(242,179,61,.16)}
.hero>*{position:relative;z-index:1}
.hero-row{border-top:0;padding-top:0}
.hero-row>div{background:rgba(255,255,255,.09);border-radius:12px;padding:8px 8px;min-width:0}
.hero-row b{display:block;font-size:12.5px;white-space:nowrap;word-break:normal}
.hero-row span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle;background:#7FE0C1}
.hero-row>div:nth-child(2) span::before{background:#FF9C8C}
.hero-row>div:nth-child(3) span::before{background:#F5C451}
.ico{background:var(--surface2);background:color-mix(in srgb,var(--tint) 16%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 24%,transparent)}
.feat{border-left:4px solid var(--tint)}
.feat .ico{background:color-mix(in srgb,var(--tint) 16%,var(--surface))}
.feat.locked{border-left-color:var(--line)}
.feat.locked .ico{background:var(--surface2);box-shadow:none}
.pill.p-open{background:color-mix(in srgb,var(--tint) 16%,var(--surface));color:var(--tint)}
.sec h2{display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:16px;border-radius:4px;background:var(--tint);flex:none}
.wchip{background:color-mix(in srgb,var(--tint) 9%,var(--surface));border-color:color-mix(in srgb,var(--tint) 30%,var(--line));position:relative;overflow:hidden}
.wchip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tint)}
.amt.in{color:var(--in)} .amt.out{color:var(--out)}
.bar i{background:linear-gradient(90deg,var(--jade),#2BA6C4)}
.bar.gold i{background:linear-gradient(90deg,#F2B33D,#E5603F)}
.bar.warn i{background:linear-gradient(90deg,#F2B33D,#E29B12)}
.bar.over i{background:var(--out)}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.nav button.on span{background:var(--jade-soft);border-radius:10px;padding:3px 14px}
.nav .fab{background:linear-gradient(135deg,var(--jade),var(--hero2));color:#fff}
.btn:not(.ghost):not(.danger){background:linear-gradient(135deg,var(--jade),color-mix(in srgb,var(--jade) 70%,#1C3F73))}
.hint{background:linear-gradient(120deg,var(--kunyit-soft),color-mix(in srgb,#7B5CD6 14%,var(--surface)))}
.cal button.sel{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.catgrid button.on{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 16%,var(--surface))}
.weeks button.done{background:linear-gradient(135deg,var(--kunyit-soft),color-mix(in srgb,#E5603F 12%,var(--surface)))}
/* ===== font judul ===== */
:root{--display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif}
.top h1,.hero .amt,.sec h2,.sheet h3,.feat b,.score-num,.lockscreen h2,.empty b,.wchip b{font-family:var(--display);font-optical-sizing:auto}
.top h1{font-size:24px;font-weight:800;letter-spacing:-.025em}
.hero .amt{font-size:40px;font-weight:800;letter-spacing:-.035em}
.sec h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sheet h3{font-size:21px;font-weight:800;letter-spacing:-.02em}
.feat b{font-size:16px;font-weight:700}
/* ===== pita judul ===== */
:root{--head1:rgba(59,111,216,.20);--head2:rgba(26,156,192,.14);--head-ink:#12305E;--head-chip:rgba(255,255,255,.55);--head-line:rgba(59,111,216,.22)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--head1:rgba(59,111,216,.30);--head2:rgba(26,156,192,.18);--head-ink:#DCE8FF;--head-chip:rgba(255,255,255,.10);--head-line:rgba(120,160,255,.22)}}
:root[data-theme="dark"]{--head1:rgba(59,111,216,.30);--head2:rgba(26,156,192,.18);--head-ink:#DCE8FF;--head-chip:rgba(255,255,255,.10);--head-line:rgba(120,160,255,.22)}
body::before{background:var(--head1);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.top{margin:0 -16px 14px;padding:14px 16px 16px;background:linear-gradient(120deg,var(--head1),var(--head2));-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);color:var(--head-ink);border-radius:0 0 22px 22px;border-bottom:1px solid var(--head-line);box-shadow:0 6px 18px -12px rgba(30,60,140,.35)}
.top h1{color:var(--head-ink)}
.top .iconbtn,.top .bookchip{background:var(--head-chip);border-color:transparent;color:var(--head-ink)}
.top .sync{box-shadow:0 0 0 2px var(--head-chip)}
.top .sync:not(.ok):not(.err):not(.sync-on){background:rgba(43,26,4,.25)}
@media (min-width:600px){.top{margin-left:0;margin-right:0;border-radius:0 0 22px 22px}}
/* ===== layar pembuka ===== */
#splash{position:fixed;inset:0;z-index:60;background:#DDEBF7;overflow:hidden;transition:opacity .55s ease,visibility 0s .55s}
#splash.hide{opacity:0;visibility:hidden}
#splash-art,#splash-art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.splash-txt{position:relative;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 14vh) 24px 0;color:#12305E}
.splash-logo{font-size:46px;animation:pop .7s ease-out both}
.splash-txt h1{font-family:var(--display);font-size:44px;font-weight:800;letter-spacing:-.03em;margin:4px 0 4px;color:#12305E}
.splash-txt p{margin:0;font-size:15px;font-weight:600;color:#36557F}
.splash-bar{width:120px;height:4px;border-radius:9px;background:rgba(18,48,94,.15);margin:22px auto 0;overflow:hidden}
.splash-bar i{display:block;height:100%;width:40%;border-radius:9px;background:#3B6FD8;animation:load 1.1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@media (prefers-reduced-motion: reduce){.sway,.splash-bar i,.splash-logo{animation:none}}
#hlogo{border-radius:10px;flex:none;box-shadow:0 2px 8px -2px rgba(18,48,106,.45)}
.splash-logo img{display:block;margin:0 auto;border-radius:26px;box-shadow:0 14px 30px -10px rgba(18,48,106,.55)}
</style>

<script>
"use strict";
/* ---------- utilitas ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nf=new Intl.NumberFormat('id-ID');
const rp=n=>(n<0?'−':'')+'Rp'+nf.format(Math.round(Math.abs(n||0)));
const rpShort=n=>{const a=Math.abs(n||0);let s;if(a>=1e9)s=(a/1e9).toFixed(1).replace('.',',')+' M';else if(a>=1e6)s=(a/1e6).toFixed(1).replace('.',',')+' jt';else if(a>=1e3)s=Math.round(a/1e3)+' rb';else s=String(Math.round(a));return(n<0?'−':'')+s;};
const rpFit=n=>{const s=rp(n);return s.length>11?(n<0?'−':'')+'Rp'+rpShort(Math.abs(n)):s;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const ymOf=iso=>String(iso).slice(0,7);
const curYM=()=>todayISO().slice(0,7);
const addMonths=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m);};
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const ymLabel=ym=>BULAN[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const dateLabel=iso=>{const[y,m,d]=iso.split('-');return +d+' '+BULAN[+m-1].slice(0,3)+' '+y;};
const daysInMonth=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const num=v=>{const n=Number(String(v??'').replace(/[^\d]/g,''));return isFinite(n)?n:0;};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const PAL=['#0E9F87','#3B6FD8','#E29B12','#E5603F','#7B5CD6','#D6457A','#3FA34D','#1A9CC0'];
function hue(s){let h=0;for(const ch of String(s))h=(h*31+ch.codePointAt(0))>>>0;return PAL[h%PAL.length];}
function tintIcons(root){root.querySelectorAll('.ico').forEach(el=>{if(el.closest('.feat')||el.style.getPropertyValue('--tint'))return;el.style.setProperty('--tint',hue(el.textContent.trim()));});}
function vals(el){const o={};el.querySelectorAll('[name]').forEach(i=>{o[i.name]=i.type==='checkbox'?i.checked:i.value;});return o;}

/* ---------- data awal ---------- */
function defaultState(){
  const out=[['Makan & minum','🍚','kebutuhan'],['Transportasi','🚌','kebutuhan'],['Tempat tinggal','🏠','kebutuhan'],['Listrik & air','💡','kebutuhan'],['Pulsa & internet','📱','kebutuhan'],['Belanja harian','🛒','kebutuhan'],['Kesehatan','🩺','kebutuhan'],['Pendidikan','🎓','kebutuhan'],['Sedekah & zakat','🤲','kebutuhan'],['Hiburan','🎬','keinginan'],['Pakaian','👕','keinginan'],['Jajan & nongkrong','☕','keinginan'],['Lainnya','📦','keinginan']];
  const inc=[['Gaji','💼'],['Hasil usaha','🧾'],['Bonus & THR','🎁'],['Hasil investasi','📈'],['Lainnya','💰']];
  const categories=[
    ...out.map(([name,icon,group],i)=>({id:'co'+i,type:'out',name,icon,group})),
    {id:'c-debtpay',type:'out',name:'Bayar utang',icon:'💳',group:'kebutuhan',sys:true},
    ...inc.map(([name,icon],i)=>({id:'ci'+i,type:'in',name,icon})),
    {id:'c-debtrecv',type:'in',name:'Terima piutang',icon:'🤝',sys:true},
  ];
  return {v:1,updatedAt:0,
    wallets:[{id:'w1',name:'Tunai',icon:'💵',initial:0},{id:'w2',name:'Rekening bank',icon:'🏦',initial:0},{id:'w3',name:'E-wallet',icon:'📲',initial:0}],
    categories,tx:[],goals:[],budgets:{},recurring:[],debts:[],assets:[],
    challenge:{base:10000,done:Array(52).fill(false)},
    roundup:{unit:1000,moved:0},
    settings:{alloc:{needs:50,wants:30,save:20},efMonths:6,book:'Pribadi',books:['Pribadi','Usaha'],pinHash:null,theme:'auto'},
    unlocked:{}};
}
function normalize(st){
  const d=defaultState();
  const s=Object.assign(d,st||{});
  s.settings=Object.assign(defaultState().settings,s.settings||{});
  s.settings.alloc=Object.assign({needs:50,wants:30,save:20},s.settings.alloc||{});
  s.challenge=Object.assign({base:10000,done:Array(52).fill(false)},s.challenge||{});
  s.roundup=Object.assign({unit:1000,moved:0},s.roundup||{});
  ['tx','goals','recurring','debts','assets','wallets','categories'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];});
  if(!s.budgets||typeof s.budgets!=='object')s.budgets={};
  if(!s.unlocked||typeof s.unlocked!=='object')s.unlocked={};
  return s;
}

/* ---------- penyimpanan ---------- */
const LS='kantong.v1';
let S;
function load(){
  try{const raw=localStorage.getItem(LS);if(raw)S=normalize(JSON.parse(raw));}catch(e){}
  if(!S)S=normalize(null);
}
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  scheduleCloud();
}

/* sinkron cloud (pribadi, hanya akun Anda) */
const cloud={db:null,uid:null,status:'off',timer:null,busy:false,pending:false,sent:{},sentMeta:null};
function paintSync(){const el=$('#sync');el.className='sync'+(cloud.status==='ok'?' ok':cloud.status==='sync'?' sync-on':cloud.status==='err'?' err':'');
  el.title={off:'Tersimpan di perangkat ini',ok:'Tersinkron ke akun Anda',sync:'Menyinkronkan…',err:'Sinkron gagal, data tetap aman di perangkat'}[cloud.status];}
async function initCloud(){
  try{
    if(!window.claude||typeof claude.use!=='function')return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    cloud.db=db;cloud.uid=id;cloud.status='sync';paintSync();
    const snap=await db.collection('data/users/'+id).get();
    let meta=null;const months={};
    snap.docs.forEach(d=>{const data=d.data()||{};if(d.id==='meta')meta=data;else if(d.id.startsWith('tx-'))months[d.id.slice(3)]=Array.isArray(data.items)?data.items:[];});
    if(meta&&meta.json&&(meta.updatedAt||0)>(S.updatedAt||0)){
      const st=JSON.parse(meta.json);st.tx=[].concat(...Object.values(months));
      S=normalize(st);
      try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
      for(const ym in months)cloud.sent[ym]=JSON.stringify(months[ym]);
      const {tx,...rest}=S;cloud.sentMeta=JSON.stringify(rest);
      applyTheme();runRecurring();render();
      if(S.settings.pinHash&&on('pin'))showLock();
      toast('Data terbaru dimuat dari akun Anda');
      cloud.status='ok';paintSync();
    }else{
      for(const ym in months)cloud.sent[ym]=JSON.stringify(months[ym]);
      if(meta&&meta.json)cloud.sentMeta=null;
      if(S.updatedAt)await pushCloud();else{cloud.status='ok';paintSync();}
    }
  }catch(e){cloud.status='err';paintSync();}
}
function scheduleCloud(){if(!cloud.db)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(pushCloud,1500);}
async function pushCloud(){
  if(!cloud.db)return;
  if(cloud.busy){cloud.pending=true;return;}
  cloud.busy=true;cloud.status='sync';paintSync();
  try{
    const base='data/users/'+cloud.uid;
    const groups={};S.tx.forEach(t=>{(groups[ymOf(t.date)]||(groups[ymOf(t.date)]=[])).push(t);});
    for(const ym in groups){const s=JSON.stringify(groups[ym]);if(cloud.sent[ym]!==s){await cloud.db.doc(base+'/tx-'+ym).set({items:groups[ym]});cloud.sent[ym]=s;}}
    for(const ym of Object.keys(cloud.sent)){if(!groups[ym]){await cloud.db.doc(base+'/tx-'+ym).delete();delete cloud.sent[ym];}}
    const {tx,...rest}=S;const m=JSON.stringify(rest);
    if(cloud.sentMeta!==m){await cloud.db.doc(base+'/meta').set({updatedAt:S.updatedAt,json:m});cloud.sentMeta=m;}
    cloud.status='ok';
  }catch(e){cloud.status='err';}
  cloud.busy=false;paintSync();
  if(cloud.pending){cloud.pending=false;pushCloud();}
}

const cat=id=>S.categories.find(c=>c.id===id)||{name:'Tanpa kategori',icon:'📦',type:'out',group:'keinginan'};
const wal=id=>S.wallets.find(w=>w.id===id)||{name:'Dompet terhapus',icon:'❔'};
function walletBalance(id){
  const w=S.wallets.find(x=>x.id===id);let b=w?(+w.initial||0):0;
  for(const t of S.tx){
    if(t.type==='in'&&t.walletId===id)b+=t.amount;
    else if(t.type==='out'&&t.walletId===id)b-=t.amount;
    else if(t.type==='save'&&t.walletId===id)b-=t.amount;
    else if(t.type==='transfer'){if(t.walletId===id)b-=t.amount;if(t.toWalletId===id)b+=t.amount;}
  }
  return b;
}
const totalBalance=()=>S.wallets.reduce((a,w)=>a+walletBalance(w.id),0);
const activeBook=()=>S.settings.books.includes(S.settings.book)?S.settings.book:S.settings.books[0];
function txs(){return on('books')?S.tx.filter(t=>(t.book||S.settings.books[0])===activeBook()):S.tx;}
function monthTotals(ym){let inc=0,exp=0,sav=0;for(const t of txs()){if(ymOf(t.date)!==ym)continue;if(t.type==='in')inc+=t.amount;else if(t.type==='out')exp+=t.amount;else if(t.type==='save')sav+=t.amount;}return{inc,exp,sav};}
function catSpent(catId,ym){let s=0;for(const t of txs())if(t.type==='out'&&t.categoryId===catId&&ymOf(t.date)===ym)s+=t.amount;return s;}
const sortTx=a=>a.slice().sort((x,y)=>y.date.localeCompare(x.date)||(y.id>x.id?1:-1));
const goalSaved=g=>(g.deposits||[]).reduce((a,d)=>a+d.amount,0);
function monthsLeft(iso){if(!iso)return null;const n=new Date();const d=new Date(iso+'T00:00:00');return (d.getFullYear()-n.getFullYear())*12+(d.getMonth()-n.getMonth());}
const debtPaid=d=>(d.payments||[]).reduce((a,p)=>a+p.amount,0);
const debtLeft=d=>Math.max(0,d.amount-debtPaid(d));
function avgMonthly(){
  const cur=curYM();const ms=[addMonths(cur,-1),addMonths(cur,-2),addMonths(cur,-3)];
  let used=ms.filter(m=>txs().some(t=>ymOf(t.date)===m&&(t.type==='in'||t.type==='out')));
  if(!used.length)used=[cur];
  let inc=0,exp=0;used.forEach(m=>{const t=monthTotals(m);inc+=t.inc;exp+=t.exp;});
  return{inc:inc/used.length,exp:exp/used.length,months:used.length,onlyCurrent:used[0]===cur&&used.length===1};
}
const emergencyGoal=()=>S.goals.find(g=>g.isEmergency);
function roundupOf(ym){const u=S.roundup.unit||1000;let s=0;for(const t of S.tx){if(t.type!=='out')continue;if(ym&&ymOf(t.date)!==ym)continue;const r=Math.ceil(t.amount/u)*u-t.amount;s+=r;}return s;}

/* ---------- aksi data ---------- */
function addDeposit(goalId,amount,walletId,date){
  const g=S.goals.find(x=>x.id===goalId);if(!g)return;
  const dep={id:uid(),amount,date,walletId:walletId||null};
  if(walletId){const t={id:uid(),type:'save',amount,walletId,goalId,depositId:dep.id,date,note:'',book:activeBook()};S.tx.push(t);dep.txId=t.id;}
  (g.deposits||(g.deposits=[])).push(dep);
}
function removeDeposit(goalId,depId,txId){
  const g=S.goals.find(x=>x.id===goalId);if(g)g.deposits=(g.deposits||[]).filter(d=>d.id!==depId);
  if(txId)S.tx=S.tx.filter(t=>t.id!==txId);
}
function postRecurring(r,ym){
  const d=ym+'-'+pad(Math.min(r.day,daysInMonth(ym)));
  S.tx.push({id:uid(),type:r.type,amount:r.amount,walletId:r.walletId,categoryId:r.categoryId,date:d,note:r.name,book:r.book||activeBook(),recurringId:r.id});
  r.lastRun=ym;
}
function runRecurring(){
  if(!on('recurring'))return 0;
  const ym=curYM(),day=new Date().getDate();let n=0;
  for(const r of S.recurring){if(!r.auto||(r.lastRun||'')>=ym||day<r.day)continue;postRecurring(r,ym);n++;}
  if(n)save();return n;
}
function budgetWarn(t){
  if(!on('budget')||t.type!=='out')return;
  const lim=+S.budgets[t.categoryId]||0;if(!lim)return;
  const sp=catSpent(t.categoryId,ymOf(t.date));const c=cat(t.categoryId);
  if(sp>lim)setTimeout(()=>toast('Anggaran '+c.name+' terlampaui '+rp(sp-lim)),1300);
  else if(sp>=lim*.8)setTimeout(()=>toast('Anggaran '+c.name+' sudah terpakai '+Math.round(sp/lim*100)+'%'),1300);
}

function txRow(t){
  let icon,title,sub,amt,cls;
  const dt=dateLabel(t.date).replace(/ \d{4}$/,'');
  if(t.type==='transfer'){icon='🔄';title='Transfer';sub=wal(t.walletId).name+' ke '+wal(t.toWalletId).name;amt=rp(t.amount);cls='';}
  else if(t.type==='save'){const g=S.goals.find(x=>x.id===t.goalId);icon=g?g.icon:'🎯';title=(t.amount>=0?'Setor ke ':'Tarik dari ')+(g?g.name:'target');sub=wal(t.walletId).name+', '+dt;amt=rp(Math.abs(t.amount));cls='save';}
  else{const c=cat(t.categoryId);icon=c.icon;title=t.note||c.name;sub=(t.note?c.name+', ':'')+wal(t.walletId).name;amt=(t.type==='in'?'+':'−')+rp(t.amount);cls=t.type;}
  return `<button class="row" data-act="tx-open" data-id="${t.id}"><span class="ico">${icon}</span><span class="row-main"><span class="row-title">${esc(title)}</span><span class="row-sub">${esc(sub)}</span></span><span class="amt ${cls}">${amt}</span></button>`;
}

  const byDay={};list.forEach(t=>{(byDay[t.date]||(byDay[t.date]=[])).push(t);});
  for(const d of Object.keys(byDay)){
    const net=byDay[d].reduce((a,t)=>a+(t.type==='in'?t.amount:t.type==='out'?-t.amount:0),0);

};

  const totLim=withB.reduce((a,c)=>a+ +S.budgets[c.id],0),totSp=withB.reduce((a,c)=>a+catSpent(c.id,ym),0);
  h+=`<div class="card"><div class="between"><b>Total</b><span class="small muted">${rp(totSp)} / ${rp(totLim)}</span></div>${barHTML(totSp/totLim*100,totSp>totLim?'over':totSp>=totLim*.8?'warn':'')}<div class="small muted">Sisa ${rp(Math.max(0,totLim-totSp))} untuk ${daysInMonth(ym)-new Date().getDate()+1} hari lagi</div></div>`;
  h+=withB.map(c=>{const lim=+S.budgets[c.id],sp=catSpent(c.id,ym),p=sp/lim*100;return `<div class="card"><div class="between"><b>${c.icon} ${esc(c.name)}</b><span class="small ${sp>lim?'amt out':'muted'}">${Math.round(p)}%</span></div>${barHTML(p,sp>lim?'over':p>=80?'warn':'')}<div class="small muted">${rp(sp)} dari ${rp(lim)}${sp>lim?', lebih '+rp(sp-lim):', sisa '+rp(lim-sp)}</div></div>`;}).join('');
  return h;
};

/* Transaksi berulang */
function upcoming(){
  const today=todayISO(),ym=curYM();
  return S.recurring.map(r=>{
    const doneThis=(r.lastRun||'')>=ym;
    const tym=doneThis?addMonths(ym,1):ym;
    const date=tym+'-'+pad(Math.min(r.day,daysInMonth(tym)));
    const days=daysBetween(today,date);
    let text;
    if(days<0)text='Terlewat '+(-days)+' hari, belum dicatat';
    else if(days===0)text=r.auto?'Hari ini (dicatat otomatis)':'Hari ini';
    else text=dateLabel(date)+', '+days+' hari lagi';
    return{r,date,days,text,overdue:days<=0&&!doneThis};
  }).sort((a,b)=>a.days-b.days);
}

  h+=`<div class="card"><div class="donutwrap">${donut(items,t.exp)}<div class="legend">${items.map((it,i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><span>${it.other?'Lainnya (gabungan)':cat(it.id).icon+' '+esc(cat(it.id).name)}</span><b>${Math.round(it.v/t.exp*100)}%</b></div>`).join('')}</div></div></div>`;
  h+=`<div class="list" style="margin-top:10px">${items.map((it,i)=>{const pv=it.other?0:(()=>{let s=0;txs().forEach(x=>{if(x.type==='out'&&x.categoryId===it.id&&ymOf(x.date)===addMonths(ym,-1))s+=x.amount;});return s;})();
    return `<div class="row"><span class="ico">${it.other?'📦':cat(it.id).icon}</span><span class="row-main"><span class="row-title">${it.other?'Lainnya (gabungan)':esc(cat(it.id).name)}</span><span class="row-sub">${it.other?'':pv?'Bulan lalu '+rp(pv):'Tidak ada bulan lalu'}</span></span><b>${rp(it.v)}</b></div>`;}).join('')}</div>`;

function barChart(months){
  const W=340,H=170,pb=22,top=10;const max=Math.max(1,...months.flatMap(m=>[m.inc,m.exp]));
  const gw=W/months.length,bw=Math.min(16,gw/3);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Pemasukan dan pengeluaran 6 bulan terakhir">`;
  s+=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>`;
  months.forEach((m,i)=>{const x=gw*i+gw/2,hi=(H-pb-top)*m.inc/max,he=(H-pb-top)*m.exp/max;
    s+=`<rect x="${x-bw-1}" y="${H-pb-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--jade)"><title>Masuk ${rp(m.inc)}</title></rect><rect x="${x+1}" y="${H-pb-he}" width="${bw}" height="${he}" rx="3" fill="var(--merah)"><title>Keluar ${rp(m.exp)}</title></rect><text x="${x}" y="${H-6}" text-anchor="middle" class="ct">${BULAN[+m.ym.slice(5)-1].slice(0,3)}</text>`;});
  return s+'</svg>';
}
function donut(items,total){
  const r=52,c=2*Math.PI*r;let off=0;
  let s=`<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="Komposisi pengeluaran"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="20"/>`;
  items.forEach((it,i)=>{const len=total?c*it.v/total:0;s+=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="20" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;});
  return s+`<text x="70" y="66" text-anchor="middle" class="dt1">Total</text><text x="70" y="84" text-anchor="middle" class="dt2">${rpShort(total)}</text></svg>`;
}

/* Skor kesehatan */
function health(){
  const av=avgMonthly();if(!av.inc&&!av.exp)return null;
  const parts=[],tips=[];
  const sr=av.inc?(av.inc-av.exp)/av.inc:0;
  const p1=Math.round(Math.max(0,Math.min(1,sr/0.2))*30);
  parts.push({label:'Rasio tabungan',pts:p1,max:30,text:av.inc?Math.round(sr*100)+'% dari pemasukan tersisa':'Belum ada pemasukan tercatat'});
  if(p1<30)tips.push('Usahakan minimal 20% pemasukan tersisa untuk ditabung. Mulai dari memangkas kategori keinginan.');
  const g=emergencyGoal();const fund=g?goalSaved(g):Math.max(0,totalBalance());
  const cover=av.exp?fund/av.exp:0;const p2=Math.round(Math.max(0,Math.min(1,cover/6))*30);
  parts.push({label:'Dana darurat',pts:p2,max:30,text:'Cukup untuk '+cover.toFixed(1).replace('.',',')+' bulan pengeluaran'+(g?'':' (dari total saldo)')});
  if(p2<30)tips.push('Bangun dana darurat sampai 6 bulan pengeluaran. Fitur Dana darurat bisa menghitung targetnya.');
  const owe=S.debts.filter(d=>d.kind==='utang').reduce((a,d)=>a+debtLeft(d),0);
  const dr=av.inc?owe/av.inc:(owe?9:0);const p3=Math.round(Math.max(0,1-dr/3)*20);
  parts.push({label:'Beban utang',pts:p3,max:20,text:owe?'Sisa utang '+rp(owe)+' ('+dr.toFixed(1).replace('.',',')+'× pemasukan bulanan)':'Tidak ada utang tercatat'});
  if(p3<20)tips.push('Prioritaskan melunasi utang berbunga tinggi lebih dulu, misalnya paylater dan kartu kredit.');
  const ym=curYM();const bs=S.categories.filter(c=>c.type==='out'&&+S.budgets[c.id]>0);
  let p4;
  if(!bs.length){p4=10;parts.push({label:'Disiplin anggaran',pts:10,max:20,text:'Belum ada anggaran yang diatur'});tips.push('Atur anggaran per kategori agar pengeluaran lebih terkendali.');}
  else{const okc=bs.filter(c=>catSpent(c.id,ym)<=+S.budgets[c.id]).length;p4=Math.round(okc/bs.length*20);parts.push({label:'Disiplin anggaran',pts:p4,max:20,text:okc+' dari '+bs.length+' kategori masih dalam batas'});if(p4<20)tips.push('Beberapa kategori melewati anggaran. Tinjau lagi batasnya atau kurangi belanja di kategori itu.');}
  const score=p1+p2+p3+p4;
  const label=score>=80?'Sangat sehat, pertahankan':score>=60?'Cukup sehat, masih bisa ditingkatkan':score>=40?'Perlu perhatian':'Perlu perbaikan segera';
  return{score,label,parts,tips};
}
VIEWS.health=()=>{
  const hs=health();
  if(!hs)return `<div class="card">${emptyHTML('Belum cukup data','Catat pemasukan dan pengeluaran Anda selama beberapa minggu, lalu skor akan muncul di sini.')}</div>`;
  let h=`<div class="card score"><div class="score-num ${hs.score>=60?'':hs.score>=40?'mid':'low'}">${hs.score}</div><div><b>${hs.label}</b><div class="small muted">Dihitung dari rata-rata ${avgMonthly().months} bulan terakhir.</div></div></div>`;
  h+=sec('Rincian nilai');
  h+=hs.parts.map(p=>`<div class="card"><div class="between"><b>${p.label}</b><span class="small muted">${p.pts}/${p.max}</span></div>${barHTML(p.pts/p.max*100,p.pts/p.max>=.67?'':p.pts/p.max>=.34?'warn':'over')}<div class="small muted">${p.text}</div></div>`).join('');
  if(hs.tips.length){h+=sec('Saran');h+=`<div class="card">${hs.tips.map(t=>`<p class="small" style="margin:6px 0">💡 ${t}</p>`).join('')}</div>`;}
  return h;
};

function dayEvents(iso){
  const ev=[];const ym=ymOf(iso),d=+iso.slice(8);
  txs().filter(t=>t.date===iso).forEach(t=>ev.push({kind:t.type==='in'?'in':t.type==='out'?'out':'other',t}));
  if(on('recurring'))S.recurring.forEach(r=>{if(Math.min(r.day,daysInMonth(ym))===d&&!((r.lastRun||'')>=ym&&txs().some(t=>t.recurringId===r.id&&t.date===iso)))ev.push({kind:'due',text:'Jadwal: '+r.name,amount:r.amount,type:r.type});});
  if(on('debts'))S.debts.forEach(x=>{if(x.due===iso&&debtLeft(x)>0)ev.push({kind:'due',text:(x.kind==='utang'?'Jatuh tempo utang ke ':'Jatuh tempo piutang dari ')+x.person,amount:debtLeft(x),type:x.kind==='utang'?'out':'in'});});
  if(on('goals'))S.goals.forEach(g=>{if(g.deadline===iso)ev.push({kind:'due',text:'Tenggat target: '+g.name,amount:Math.max(0,g.target-goalSaved(g)),type:'save'});});
  return ev;
}
VIEWS.calendar=()=>{
  const ym=ui.calYM,first=(new Date(+ym.slice(0,4),+ym.slice(5,7)-1,1).getDay()+6)%7,n=daysInMonth(ym),today=todayISO();
  let h=monthNav('calYM',ym);
  h+=`<div class="cal">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="wd">${d}</div>`).join('')}`;
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=n;d++){const iso=ym+'-'+pad(d);const ev=dayEvents(iso);const k=new Set(ev.map(e=>e.kind));
    h+=`<button class="${iso===today?'today':''} ${iso===ui.calDay?'sel':''}" data-act="cal-day" data-k="${iso}">${d}<span class="dots">${k.has('in')?'<i style="background:var(--jade)"></i>':''}${k.has('out')?'<i style="background:var(--merah)"></i>':''}${k.has('due')?'<i style="background:var(--kunyit-bar)"></i>':''}</span></button>`;}
  h+='</div>';
  h+=`<p class="small muted"><i class="dot" style="background:var(--jade)"></i>Pemasukan <i class="dot" style="background:var(--merah);margin-left:8px"></i>Pengeluaran <i class="dot" style="background:var(--kunyit-bar);margin-left:8px"></i>Jadwal & tenggat</p>`;
  if(ymOf(ui.calDay)===ym){
    const ev=dayEvents(ui.calDay);
    h+=sec(dateLabel(ui.calDay));
    if(!ev.length)h+=`<div class="card small muted">Tidak ada catatan atau jadwal di hari ini.</div>`;
    else h+=`<div class="list">${ev.map(e=>e.t?txRow(e.t):`<div class="row"><span class="ico">⏰</span><span class="row-main"><span class="row-title">${esc(e.text)}</span></span><span class="amt ${e.type}">${rp(e.amount)}</span></div>`).join('')}</div>`;
  }
  return h;
};

function parseCSV(text){
  const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const delim=[',',';','\t','|'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[];}else f+=c;}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()));
}
function parseAmount(s){
  if(s==null)return NaN;let str=String(s).trim();if(!str)return NaN;
  let neg=/^\(.*\)$/.test(str)||/^-|-\s*$/.test(str)||/\b(DB|D|DR)\b\s*$/i.test(str);
  const cr=/\b(CR|K|C)\b\s*$/i.test(str);
  str=str.replace(/[^\d.,]/g,'');if(!str)return NaN;
  const m=str.match(/[.,](\d{1,2})$/);let n;
  if(m){n=Number(str.slice(0,-m[0].length).replace(/[.,]/g,'')+'.'+m[1]);}else n=Number(str.replace(/[.,]/g,''));
  if(!isFinite(n))return NaN;if(cr)neg=false;return neg?-n:n;
}
function parseDate(s){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+pad(m[2])+'-'+pad(m[1]);}
  if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})$/)))return new Date().getFullYear()+'-'+pad(m[2])+'-'+pad(m[1]);
  const mon={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,aug:8,agt:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
  if((m=s.match(/^(\d{1,2})[\s-]([A-Za-z]{3})[A-Za-z]*[\s-](\d{2,4})/))&&mon[m[2].toLowerCase()]){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+pad(mon[m[2].toLowerCase()])+'-'+pad(m[1]);}
  return null;
}
function guessMap(header){
  const f=re=>header.findIndex(h=>re.test(h||''));
  const map={date:f(/tanggal|tgl|date/i),note:f(/keterangan|deskripsi|description|uraian|remark|catatan/i),amount:f(/^(jumlah|nominal|amount|mutasi)$/i),debit:f(/debit|debet|keluar/i),credit:f(/kredit|credit|masuk/i)};
  if(map.date<0)map.date=0;
  if(map.amount<0&&map.debit<0&&map.credit<0)map.amount=f(/jumlah|nominal|amount|mutasi/i);
  if(map.amount<0&&map.debit<0&&map.credit<0)map.amount=header.length-1;
  return map;
}
function parseImport(){
  const ok=[];let bad=0;const M=IMP.map;
  IMP.rows.forEach(r=>{
    const date=parseDate(r[M.date]);let amt=NaN;
    if(M.amount>=0)amt=parseAmount(r[M.amount]);
    if((isNaN(amt)||amt===0)&&(M.debit>=0||M.credit>=0)){const d=M.debit>=0?parseAmount(r[M.debit]):NaN,c=M.credit>=0?parseAmount(r[M.credit]):NaN;if(!isNaN(d)&&Math.abs(d)>0)amt=-Math.abs(d);else if(!isNaN(c)&&Math.abs(c)>0)amt=Math.abs(c);}
    if(!date||isNaN(amt)||amt===0){bad++;return;}
    ok.push({date,amount:Math.abs(Math.round(amt)),type:amt<0?'out':'in',note:M.note>=0?(r[M.note]||''):''});
  });
  return{ok,bad};
}

async function offerDownload(filename,data,mime){
  try{
    if(window.claude&&claude.use){const dl=await claude.use('downloads');if(dl){await dl.save({filename,data:new Blob([data],{type:mime})});toast('File disimpan');return;}}
  }catch(e){if(e&&e.code==='declined')return;}
  if(!(window.claude&&claude.use)){try{const url=URL.createObjectURL(new Blob([data],{type:mime}));const el=document.createElement('a');el.href=url;el.download=filename;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('File diunduh');return;}catch(e){}}
  openSheet(`<h3>Salin data</h3><p class="small muted">Unduhan tidak tersedia di tampilan ini. Salin teks di bawah, lalu simpan di catatan atau kirim ke email Anda sendiri.</p><textarea readonly style="width:100%;height:220px;background:var(--surface2);border:0;border-radius:12px;padding:10px;font-size:12px;color:var(--ink)">${esc(data)}</textarea>
  <div class="btns"><button class="btn ghost" data-act="close">Tutup</button><button class="btn" id="cp">Salin</button></div>`,el=>{
    el.querySelector('#cp').onclick=async()=>{const ta=el.querySelector('textarea');try{await navigator.clipboard.writeText(ta.value);toast('Tersalin');}catch(e){ta.select();document.execCommand('copy');toast('Tersalin');}};});
}
function exportCSV(){
  const rows=[['Tanggal','Jenis','Kategori','Dompet','Ke dompet','Jumlah','Catatan','Buku']];
  sortTx(S.tx).forEach(t=>rows.push([t.date,{in:'Masuk',out:'Keluar',transfer:'Transfer',save:'Setoran target'}[t.type],t.categoryId?cat(t.categoryId).name:'',wal(t.walletId).name,t.toWalletId?wal(t.toWalletId).name:'',t.amount,t.note||'',t.book||'']));
  return rows.map(r=>r.map(x=>{const s=String(x);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
}

/* ---------- event ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-money]')){const dg=t.value.replace(/\D/g,'');t.value=dg?nf.format(+dg):'';}
  if(t.id==='hq'){ui.histQ=t.value;const pos=t.selectionStart;render();const n=$('#hq');if(n){n.focus();n.setSelectionRange(pos,pos);}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.matches('[data-imp]')){const k=t.dataset.imp;if(k==='wallet')IMP.wallet=t.value;else IMP.map[k]=+t.value;render();}
  if(t.id==='file-csv'&&t.files[0]){const text=await t.files[0].text();const rows=parseCSV(text.replace(/^\uFEFF/,''));
    if(rows.length<2)return toast('File kosong atau tidak terbaca');
    let hi=rows.findIndex(r=>r.some(c=>/tanggal|tgl|date/i.test(c)));if(hi<0)hi=0;
    const header=rows[hi];IMP={header,rows:rows.slice(hi+1),map:guessMap(header),wallet:S.wallets[0]&&S.wallets[0].id};render();}
  if(t.id==='file-json'&&t.files[0]){
    try{const data=JSON.parse(await t.files[0].text());if(!data||!Array.isArray(data.wallets)||!Array.isArray(data.tx))throw 0;
      confirmBox('Pulihkan cadangan?','Data saat ini ('+S.tx.length+' transaksi) akan diganti dengan isi cadangan ('+data.tx.length+' transaksi).','Pulihkan',()=>{S=normalize(data);save();applyTheme();ui.page=null;ui.tab='home';render();toast('Cadangan dipulihkan');},true);
    }catch(err){toast('File cadangan tidak valid');}
    t.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
document.addEventListener('click',async e=>{
  const tabBtn=e.target.closest('[data-tab]');
  if(tabBtn){ui.tab=tabBtn.dataset.tab;ui.page=null;render();window.scrollTo(0,0);return;}
  const tg=e.target.closest('[data-tab-go]');
  if(tg){ui.tab=tg.dataset.tabGo;ui.page=null;render();window.scrollTo(0,0);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,k=b.dataset.k,id=b.dataset.id;
  switch(a){
    case 'close':closeSheet();break;
    case 'back':ui.page=null;render();break;
    case 'go':go(k);break;
    case 'tx-new':txSheet(null,b.dataset.type);break;
    case 'tx-open':txSheet(id);break;
    case 'mprev':case 'mnext':ui[k]=addMonths(ui[k],a==='mprev'?-1:1);if(k==='calYM')ui.calDay=ui.calYM===curYM()?todayISO():ui.calYM+'-01';render();break;
    case 'htype':ui.histType=k;render();break;
    case 'feat':if(on(k))go(k);else askUnlock(k);break;
    case 'relock':askRelock(k);break;
    case 'unlock-all':confirmBox('Buka semua fitur?','Semua '+FEATURES.filter(f=>!on(f.key)).length+' fitur yang terkunci akan aktif. Anda tetap bisa mengunci lagi satu per satu.','Buka semua',()=>{FEATURES.forEach(f=>S.unlocked[f.key]=true);save();runRecurring();render();toast('Semua fitur dibuka');});break;
    case 'theme':S.settings.theme=k;applyTheme();save();render();break;
    case 'wallet-edit':walletSheet(id);break;
    case 'cat-edit':catSheet(id,b.dataset.type);break;
    case 'goal-edit':goalSheet(id);break;
    case 'deposit':depositSheet(id,b.dataset.mode);break;
    case 'budget-edit':budgetSheet();break;
    case 'alloc-edit':allocSheet();break;
    case 'rec-edit':recSheet(id);break;
    case 'rec-post':{const r=S.recurring.find(x=>x.id===id);if(r){postRecurring(r,curYM());save();render();toast(r.name+' dicatat');}break;}
    case 'ch-toggle':{const i=+b.dataset.i;S.challenge.done[i]=!S.challenge.done[i];save();render();break;}
    case 'ch-base':{const v=num($('#ch-base').value);if(v<=0)return toast('Isi nominal lebih dari 0');S.challenge.base=v;save();render();toast('Nominal disimpan');break;}
    case 'ch-reset':confirmBox('Mulai ulang tantangan?','Semua centang minggu akan dihapus.','Mulai ulang',()=>{S.challenge.done=Array(52).fill(false);save();render();},true);break;
    case 'ru-unit':S.roundup.unit=+k;save();render();break;
    case 'ru-move':{const avail=Math.max(0,roundupOf(null)-S.roundup.moved);
      if(!S.goals.length){if(!on('goals')){confirmBox('Perlu fitur Target tabungan','Receh dipindahkan ke target tabungan. Buka fitur Target tabungan dan buat target dulu?','Buka & buat target',()=>{S.unlocked.goals=true;save();go('goals');goalSheet();});}else{toast('Buat target tabungan dulu');go('goals');}break;}
      depositSheet(null,'in',avail);break;}
    case 'ef-months':S.settings.efMonths=+k;save();render();break;
    case 'ef-goal':{const need=Math.round(avgMonthly().exp*S.settings.efMonths);let g=emergencyGoal();
      if(g)g.target=need;else{g={id:uid(),name:'Dana darurat',icon:'🛟',target:need,deadline:'',deposits:[],isEmergency:true};S.goals.push(g);}
      if(!on('goals'))S.unlocked.goals=true;save();render();toast('Target dana darurat '+rp(need)+' disimpan di Target tabungan');break;}
    case 'cal-day':ui.calDay=k;render();break;
    case 'debt-tab':ui.debtTab=k;render();break;
    case 'debt-edit':debtSheet(id);break;
    case 'debt-pay':paySheet(id);break;
    case 'asset-edit':assetSheet(id);break;
    case 'book-switch':{const bs=S.settings.books;const i=bs.indexOf(activeBook());S.settings.book=bs[(i+1)%bs.length];save();render();toast('Buku aktif: '+S.settings.book);break;}
    case 'book-set':S.settings.book=k;save();render();break;
    case 'book-add':openSheet(`<h3>Buku baru</h3><label class="field"><span>Nama buku</span><input name="n" placeholder="Misalnya Keluarga, Warung"></label><div class="btns"><button class="btn ghost" data-act="close">Batal</button><button class="btn" id="ok">Tambah</button></div>`,el=>{el.querySelector('#ok').onclick=()=>{const n=vals(el).n.trim();if(!n)return toast('Isi nama buku');if(S.settings.books.includes(n))return toast('Nama buku sudah ada');S.settings.books.push(n);save();closeSheet();render();};});break;
    case 'csv-pick':$('#file-csv').click();break;
    case 'csv-go':{const p=parseImport();const inC=S.categories.find(c=>c.type==='in'&&c.name==='Lainnya')||S.categories.find(c=>c.type==='in');const outC=S.categories.find(c=>c.type==='out'&&c.name==='Lainnya')||S.categories.find(c=>c.type==='out');
      p.ok.forEach(r=>S.tx.push({id:uid(),type:r.type,amount:r.amount,walletId:IMP.wallet,categoryId:r.type==='in'?inC.id:outC.id,date:r.date,note:r.note.slice(0,80),book:activeBook()}));
      const n=p.ok.length;IMP=null;save();render();toast(n+' transaksi diimpor');break;}
    case 'pin-set':{const a1=$('#pin-a').value,a2=$('#pin-b').value;if(!/^\d{4,6}$/.test(a1))return toast('PIN harus 4–6 angka');if(a1!==a2)return toast('PIN tidak sama');S.settings.pinHash=await hashPin(a1);save();render();toast('PIN disimpan');break;}
    case 'pin-lock':showLock();break;
    case 'pin-remove':confirmBox('Hapus PIN?','Lumbung Duit tidak akan meminta PIN lagi.','Hapus PIN',()=>{S.settings.pinHash=null;save();render();},true);break;
    case 'export-json':offerDownload('lumbung-duit-cadangan-'+todayISO()+'.json',JSON.stringify(S),'application/json');break;
    case 'import-json':$('#file-json').click();break;
    case 'export-csv':offerDownload('lumbung-duit-transaksi-'+todayISO()+'.csv',exportCSV(),'text/csv');break;
    case 'wipe':confirmBox('Hapus semua data?','Semua transaksi, dompet, target, dan pengaturan akan dihapus permanen dari perangkat ini. Simpan cadangan dulu jika ragu.','Hapus semua',()=>{S=normalize(null);save();applyTheme();ui.page=null;ui.tab='home';render();toast('Semua data dihapus');},true);break;
  }
});

/* ---------- layar pembuka: padi siap panen ---------- */
function splashSVG(){
  const W=400,H=800;let seed=11;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;const f=n=>n.toFixed(1);
  const stalk=(x,h,sc,cols,delay)=>{
    const by=H+10,tx=x+(R()-.5)*30*sc,ty=by-h,dir=R()<.5?-1:1;
    let g=`<g class="sway" style="animation-delay:${f(-delay)}s">`;
    for(let i=0;i<2;i++){const ly=by-h*(.22+R()*.3),lx=x+(tx-x)*((by-ly)/h),ld=(i?1:-1)*dir;
      g+=`<path d="M${f(lx)} ${f(ly)} Q${f(lx+ld*40*sc)} ${f(ly-55*sc)} ${f(lx+ld*(70+R()*30)*sc)} ${f(ly-15*sc+R()*40*sc)}" stroke="${cols.leaf}" stroke-width="${f(3.2*sc)}" fill="none" stroke-linecap="round"/>`;}
    g+=`<path d="M${f(x)} ${by} Q${f(x+(tx-x)*.2)} ${f(by-h*.55)} ${f(tx)} ${f(ty)}" stroke="${cols.stem}" stroke-width="${f(2.6*sc)}" fill="none" stroke-linecap="round"/>`;
    const p0=[tx,ty],p1=[tx+dir*34*sc,ty-30*sc],p2=[tx+dir*(62+R()*20)*sc,ty+(55+R()*25)*sc];
    g+=`<path d="M${f(p0[0])} ${f(p0[1])} Q${f(p1[0])} ${f(p1[1])} ${f(p2[0])} ${f(p2[1])}" stroke="${cols.stem}" stroke-width="${f(1.6*sc)}" fill="none"/>`;
    const n=16;
    for(let i=2;i<=n;i++){const t=i/n,mt=1-t;
      const px=mt*mt*p0[0]+2*mt*t*p1[0]+t*t*p2[0],py=mt*mt*p0[1]+2*mt*t*p1[1]+t*t*p2[1];
      const dx=2*mt*(p1[0]-p0[0])+2*t*(p2[0]-p1[0]),dy=2*mt*(p1[1]-p0[1])+2*t*(p2[1]-p1[1]);
      const ang=Math.atan2(dy,dx)*180/Math.PI,L=Math.hypot(dx,dy)||1;
      for(const side of [-1,1]){if(i===n&&side===1)continue;
        const gx=px-dy/L*4*sc*side,gy=py+dx/L*4*sc*side,c=cols.grain[(i+(side>0?1:0))%cols.grain.length];
        g+=`<ellipse cx="${f(gx)}" cy="${f(gy)}" rx="${f(5.4*sc)}" ry="${f(2.6*sc)}" transform="rotate(${f(ang+side*35)} ${f(gx)} ${f(gy)})" fill="${c}"/>`;}
    }
    return g+'</g>';
  };
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg"><defs>
  <linearGradient id="sp-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A7CDF0"/><stop offset=".5" stop-color="#DDEBF7"/><stop offset=".72" stop-color="#FBE9B9"/></linearGradient>
  <radialGradient id="sp-sun"><stop offset="0" stop-color="#FFF4CC" stop-opacity=".95"/><stop offset="1" stop-color="#FFF4CC" stop-opacity="0"/></radialGradient>
  <linearGradient id="sp-field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6C15C"/><stop offset="1" stop-color="#B98428"/></linearGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#sp-sky)"/>
  <circle cx="300" cy="492" r="150" fill="url(#sp-sun)"/><circle cx="300" cy="492" r="30" fill="#FFF2C2"/>
  <path d="M0 520 Q70 470 150 500 T300 488 T400 500 V560 H0Z" fill="#8FB3B0" opacity=".55"/>
  <path d="M0 535 Q90 505 190 528 T400 522 V570 H0Z" fill="#9DBB83" opacity=".75"/>
  <rect y="548" width="${W}" height="${H-548}" fill="url(#sp-field)"/>`;
  for(let i=0;i<150;i++){const y=556+R()*120,x=R()*W,l=3+(y-550)/18;s+=`<path d="M${f(x)} ${f(y)} l${f((R()-.5)*3)} ${f(-l)}" stroke="#C08E2E" stroke-width="1.4" opacity=".55" stroke-linecap="round"/>`;}
  const back={stem:'#C9AA57',leaf:'#C2B465',grain:['#F2D47D','#ECC867','#F6DE92']};
  const front={stem:'#9A7A2C',leaf:'#8E9A43',grain:['#E3AE2F','#D29A22','#EFC04A','#C98B1C']};
  s+='<g opacity=".92">';for(let i=0;i<26;i++)s+=stalk(-20+i*17+R()*10,220+R()*100,.62,back,R()*3);s+='</g>';
  for(let i=0;i<13;i++)s+=stalk(-10+i*33+R()*14,300+R()*120,1,front,R()*3);
  return s+'</svg>';
}
const splashT0=performance.now();
try{$('#splash-art').innerHTML=splashSVG();}catch(e){}

/* ---------- mulai ---------- */
load();applyTheme();
const autoN=runRecurring();
if(S.settings.pinHash&&on('pin'))showLock();
render();
if(autoN)toast(autoN+' transaksi berulang dicatat otomatis');
initCloud();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
(function(){const sp=$('#splash');if(!sp)return;const hide=()=>{if(sp.classList.contains('hide'))return;sp.classList.add('hide');setTimeout(()=>sp.remove(),650);};sp.addEventListener('click',hide);setTimeout(hide,Math.max(400,4200-(performance.now()-splashT0)));})();
</script>
